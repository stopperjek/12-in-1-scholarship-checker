<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>12-in-1 MEGA Checker - JAMB to Abroad 2026</title><style>body{font-family:Arial;max-width:750px;margin:auto;padding:15px;background:#f0fff4}.box{border:2px solid #0a5c36;border-radius:15px;padding:15px;background:white}.tab{padding:6px 10px;border:1px solid #0a5c36;background:white;border-radius:20px;cursor:pointer;font-size:11px;margin:2px}.tab.active{background:#0a5c36;color:white}input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.result{margin-top:15px;padding:12px;background:#e8f5e9;border-radius:10px;display:none}</style></head><body><div class="box"><h2 style="text-align:center;color:#0a5c36">🌍 12-in-1 MEGA Checker</h2><p style="text-align:center;font-size:13px">Check 12 countries with JAMB/WAEC - First in Naija - FREE</p><div style="display:flex;flex-wrap:wrap;justify-content:center;margin:12px 0"><button onclick="showTab('ng')" class="tab active">🇳🇬NG</button><button onclick="showTab('ca')" class="tab">🇨🇦CA</button><button onclick="showTab('us')" class="tab">🇺🇸US</button><button onclick="showTab('uk')" class="tab">🇬🇧UK</button><button onclick="showTab('de')" class="tab">🇩🇪DE</button><button onclick="showTab('au')" class="tab">🇦🇺AU</button><button onclick="showTab('nl')" class="tab">🇳🇱NL</button><button onclick="showTab('se')" class="tab">🇸🇪SE</button><button onclick="showTab('ie')" class="tab">🇮🇪IE</button><button onclick="showTab('nz')" class="tab">🇳🇿NZ</button><button onclick="showTab('fr')" class="tab">🇫🇷FR</button><button onclick="showTab('tr')" class="tab">🇹🇷TR</button></div><label>JAMB Score:</label><input type="number" id="jamb" placeholder="e.g 250"><label>WAEC Credits:</label><select id="waec"><option value="0">Select</option><option value="5">5 credits</option><option value="7">6-7 credits</option><option value="9">8-9 Distinction</option></select><label>Budget/year:</label><select id="budget"><option value="0">Need full scholarship</option><option value="3000">Up to $3k</option><option value="10000">Up to $10k</option><option value="20000">$20k+</option></select><button onclick="checkEligibility()" style="width:100%;padding:12px;background:#0a5c36;color:white;border:none;border-radius:10px;margin-top:10px;font-weight:bold;cursor:pointer">CHECK 12 COUNTRIES NOW</button><div id="result" class="result"></div><p style="text-align:center;font-size:10px;color:#666;margin-top:10px">Built Oct 29 2026 by stopperjek | First 12-in-1 in Naija | We never ask for money</p></div><script>let currentTab='ng';function showTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.getElementById('result').style.display='none';}function checkEligibility(){let jamb=parseInt(document.getElementById('jamb').value)||0;let waec=parseInt(document.getElementById('waec').value)||0;let r=document.getElementById('result');let msg='';if(jamb<50||waec==0){msg='❌ Enter JAMB and WAEC first';}else{let base='With JAMB '+jamb+' & '+waec+' credits: ';if(currentTab=='ng')msg=jamb>=180?'✅ '+base+' MTN, PTDF, TETFund, Agbami eligible!':'⚠️ '+base+' Try remedial + low JAMB scholarship.';else if(currentTab=='ca')msg=jamb>=200&&waec>=5?'✅ '+base+' Canada $2k-$10k entrance. Seneca, Humber, Conestoga.':'⚠️ Need 200+ & 5 credits.';else if(currentTab=='us')msg=jamb>=250&&waec>=7?'✅ '+base+' USA $5k-$20k merit.':'⚠️ USA need 250+.';else if(currentTab=='uk')msg=waec>=5?'✅ '+base+' UK £2k-£5k, foundation route.':'❌ Need 5 credits.';else if(currentTab=='de')msg=waec>=5?'✅ '+base+' GERMANY FREE! $0 tuition public uni. DAAD.':'❌ Need 5.';else if(currentTab=='au')msg=jamb>=200&&waec>=5?'✅ '+base+' Australia AUD $5k-$15k.':'⚠️ Need 200+.';else if(currentTab=='nl')msg=waec>=7?'✅ '+base+' Netherlands €2k-€10k Holland Scholarship.':'⚠️ Need 6-7.';else if(currentTab=='se')msg=waec>=7?'✅ '+base+' Sweden SEK 10k-50k.':'⚠️ Need 6-7.';else if(currentTab=='ie')msg=waec>=5?'✅ '+base+' Ireland €2k-€10k, NO IELTS if WAEC C in English.':'❌ Need 5.';else if(currentTab=='nz')msg=jamb>=200&&waec>=5?'✅ '+base+' NZ NZD $5k-$15k.':'⚠️ Need 200+.';else if(currentTab=='fr')msg=waec>=5?'✅ '+base+' France €2k-€8k Eiffel.':'❌ Need 5.';else if(currentTab=='tr')msg=waec>=5?'✅ '+base+' Turkey Full Türkiye Burslari + stipend!':'❌ Need 5.';}msg+='<br><br>👉 Join WhatsApp for updates.<br><small>Est. only - Oct 29 2026</small>';r.innerHTML=msg;r.style.display='block';}</script></body></html>
